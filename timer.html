<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floating Countdown Timer</title>
<style>
  :root{
    --bg: #000000;
    --card: rgba(255,255,255,0.06);
    --text: #f5f5f5;
    --muted: rgba(245,245,245,0.6);
    --accent: #ffffff;
    --glow: #ffe600;
    --glow-base: #ffe600;
    --outline-color: #ffffff;
    --outline-width: 2px;
    --size-scale: 1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }

  /* ---- neon color stages (numbers glow, background stays black) ---- */
  body.stage-yellow{ --glow:var(--glow-base); }
  body.stage-orange{ --glow:#ffb020; }
  body.stage-red{ --glow:#ff2050; }
  body.flash #display{ animation: flashGlow .6s ease-in-out infinite; }
  @keyframes flashGlow{
    0%,100%{ color:#ff2050; text-shadow:0 0 10px #ff2050,0 0 26px #ff2050,0 0 60px #ff2050; }
    50%{ color:#ffffff; text-shadow:0 0 16px #ff2050,0 0 40px #ff2050,0 0 90px #ff2050; }
  }

  header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px 10px 0;
    flex-wrap:wrap;
    -webkit-app-region: drag;
  }
  header button, header img{ -webkit-app-region: no-drag; }
  #schoolBadge{
    width:44px;
    height:44px;
    object-fit:contain;
  }
  #closeAppBtn{
    margin-left:auto;
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:4px 8px;
  }
  #closeAppBtn:hover{ color:#ff6b6b; }
  .tab{
    background:rgba(255,255,255,0.1);
    border:none;
    color:var(--text);
    padding:8px 16px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    opacity:.7;
  }
  .tab.active{ opacity:1; background:rgba(255,255,255,0.22); font-weight:600; }

  main{
    width:100%;
    max-width:520px;
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    gap:14px;
  }

  .panel{
    width:100%;
    background:var(--card);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .hidden{ display:none !important; }

  .presets{ display:flex; flex-wrap:wrap; gap:8px; }
  .presets button{
    flex:1 1 60px;
    padding:10px 6px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--text);
    font-size:14px;
    cursor:pointer;
  }
  .presets button:hover{ background:rgba(255,255,255,0.18); }

  .custom-row{ display:flex; align-items:center; gap:8px; }
  .custom-row input[type=number]{
    width:70px;
    padding:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.2);
    color:var(--text);
    font-size:16px;
    text-align:center;
  }
  .custom-row input[type=time]{
    padding:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.2);
    color:var(--text);
    font-size:16px;
    color-scheme:dark;
  }
  label{ font-size:13px; color:var(--muted); }
  .hint-text{ font-size:12px; color:var(--muted); min-height:15px; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  input[type=color]{
    width:40px;
    height:34px;
    padding:2px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.2);
    cursor:pointer;
  }
  input[type=range]{ accent-color:#ffe600; }

  .primary-btn{
    padding:12px 18px;
    border-radius:12px;
    border:none;
    background:#ffffff;
    color:#10321f;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .primary-btn:hover{ filter:brightness(0.95); }
  .ghost-btn{
    padding:10px 16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.35);
    background:transparent;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
  }
  .ghost-btn:hover{ background:rgba(255,255,255,0.1); }
  .danger-btn{ border-color:rgba(255,120,120,0.6); color:#ffdcdc; }

  #timerCard{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:2px 0;
  }
  #segmentLabel{
    font-size:clamp(11px, 3vh, 15px);
    color:var(--muted);
    min-height:18px;
    text-align:center;
  }
  #timerCard.is-floating #segmentLabel{ display:none; }
  #displayFrame{
    width:auto;
    max-width:98%;
    flex:0 0 auto;
    min-height:0;
    /* modest size in the normal in-page view; the floating window gets
       the much larger fluid size below since it's a small standalone box */
    font-size:calc(clamp(40px, 11vw, 110px) * var(--size-scale));
    background:#000;
    border:none;
    border-radius:12px;
    padding:0.08em 0.3em;
    display:flex;
    justify-content:center;
    overflow:visible;
  }
  #timerCard.is-floating #displayFrame{
    font-size:calc(clamp(28px, min(22vw, 32vh), 260px) * var(--size-scale));
  }
  #display{
    font-size:inherit;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
    font-weight:800;
    letter-spacing:0.02em;
    text-align:center;
    color:var(--glow);
    -webkit-text-stroke:var(--outline-width) var(--outline-color);
    paint-order:stroke fill;
    text-shadow:
      0 0 clamp(4px,1vw,10px) var(--glow),
      0 0 clamp(10px,2.5vw,26px) var(--glow),
      0 0 clamp(24px,5vw,60px) var(--glow),
      0 0 clamp(48px,9vw,110px) var(--glow);
    transition:color .5s ease, text-shadow .5s ease;
  }
  #upnext{ font-size:13px; color:var(--muted); min-height:16px; }
  .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .icon-only-btn{
    font-size:13px;
    line-height:1;
    padding:5px 8px;
  }

  /* when floated (PiP or the Electron app), controls tuck away and only
     reappear when the cursor is near the bottom edge or over the buttons */
  #hoverZone{ display:none; }
  #timerCard.is-floating #hoverZone{
    display:block;
    position:fixed;
    left:0; right:0; bottom:0;
    height:40px;
    z-index:10;
  }
  #timerCard.is-floating #runControls,
  #timerCard.is-floating #dismissControls{
    position:fixed;
    left:0; right:0; bottom:0;
    margin:0;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0));
    transform:translateY(100%);
    transition:transform .22s ease;
    z-index:20;
  }
  #timerCard.is-floating.controls-visible #runControls,
  #timerCard.is-floating.controls-visible #dismissControls{
    transform:translateY(0);
  }

  .schedule-list{ display:flex; flex-direction:column; gap:8px; }
  .schedule-item{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.06);
    padding:8px 10px;
    border-radius:10px;
  }
  .schedule-item input[type=text]{
    flex:2;
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.2);
    color:var(--text);
    padding:8px;
    border-radius:8px;
  }
  .schedule-item input[type=number]{
    width:60px;
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.2);
    color:var(--text);
    padding:8px;
    border-radius:8px;
    text-align:center;
  }
  .icon-btn{
    background:transparent;
    border:none;
    color:#ffb3b3;
    font-size:18px;
    cursor:pointer;
    padding:2px 6px;
  }
  #pipNote{ font-size:12px; color:var(--muted); text-align:center; }
  footer{ padding:8px; font-size:11px; color:var(--muted); text-align:center; }
  a{ color:inherit; }
</style>
</head>
<body class="stage-yellow">
<header>
  <img src="midstream-ridge-badge.png" alt="Midstream Ridge badge" id="schoolBadge" />
  <button class="tab active" data-mode="timer">Timer</button>
  <button class="tab" data-mode="schedule">Schedule</button>
  <button class="tab" data-mode="sound">Alarm Sound</button>
  <button class="tab" data-mode="settings">Settings</button>
  <button id="closeAppBtn" class="hidden" title="Close" aria-label="Close">✕</button>
</header>

<main>
  <div id="timerCard">
    <div id="segmentLabel"></div>
    <div id="displayFrame"><div id="display">00:00</div></div>
    <div id="upnext"></div>
    <div class="controls" id="runControls">
      <button class="ghost-btn icon-only-btn" id="pauseBtn" title="Pause" aria-label="Pause">⏸️</button>
      <button class="ghost-btn icon-only-btn" id="resetBtn" title="Reset" aria-label="Reset">🔄</button>
      <button class="ghost-btn danger-btn icon-only-btn" id="stopBtn" title="Stop" aria-label="Stop">⏹️</button>
      <button class="primary-btn icon-only-btn" id="pipBtn" title="Float on Top" aria-label="Float on Top">📌</button>
    </div>
    <div class="controls hidden" id="dismissControls">
      <button class="primary-btn" id="dismissBtn">🔕 Dismiss Alarm</button>
    </div>
    <div id="pipNote" class="hidden">Floating window works in Chrome / Edge on desktop — it will stay on top of PowerPoint, Word, and every other app.</div>
    <div id="hoverZone"></div>
  </div>

  <!-- TIMER SETUP -->
  <section class="panel" id="panel-timer">
    <label>Quick presets (minutes)</label>
    <div class="presets" id="presets"></div>
    <label>Custom time</label>
    <div class="custom-row">
      <input type="number" id="customMin" min="0" placeholder="mm" />
      <span>:</span>
      <input type="number" id="customSec" min="0" max="59" placeholder="ss" />
      <button class="primary-btn" id="startCustomBtn">Start</button>
    </div>
    <label>Countdown to a time of day</label>
    <div class="custom-row">
      <input type="time" id="targetTime" step="60" />
      <button class="primary-btn" id="startTargetBtn">Start</button>
    </div>
    <div id="targetHint" class="hint-text"></div>
    <div class="row">
      <input type="checkbox" id="autoBreak" />
      <label for="autoBreak">Start a break automatically when this ends, for</label>
      <input type="number" id="breakMin" min="0" value="5" style="width:60px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.2);color:var(--text);text-align:center;" />
      <label>min</label>
    </div>
  </section>

  <!-- SCHEDULE -->
  <section class="panel hidden" id="panel-schedule">
    <label>Schedule of events (runs in order, bell between each)</label>
    <div class="schedule-list" id="scheduleList"></div>
    <button class="ghost-btn" id="addEventBtn">+ Add event</button>
    <button class="primary-btn" id="startScheduleBtn">Start Schedule</button>
  </section>

  <!-- SOUND -->
  <section class="panel hidden" id="panel-sound">
    <label>Alarm sound (plays on a loop when the timer ends)</label>
    <div class="row">
      <input type="file" id="soundFile" accept="audio/*" />
      <button class="ghost-btn" id="testSoundBtn">Test</button>
      <button class="ghost-btn danger-btn" id="clearSoundBtn">Reset to default</button>
    </div>
    <div id="soundName" style="font-size:13px;color:var(--muted);"></div>
    <label>Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" />
  </section>

  <!-- SETTINGS -->
  <section class="panel hidden" id="panel-settings">
    <label>Digit colour</label>
    <div class="row">
      <input type="color" id="digitColor" value="#ffe600" />
      <span id="digitColorHex" class="hint-text">#FFE600</span>
    </div>
    <label>Digit outline</label>
    <div class="row">
      <input type="color" id="outlineColor" value="#ffffff" />
      <span id="outlineColorHex" class="hint-text">#FFFFFF</span>
      <label for="outlineWidth" style="margin-left:8px;">Width</label>
      <input type="range" id="outlineWidth" min="0" max="6" step="1" value="2" style="flex:1; min-width:100px;" />
      <span id="outlineWidthLabel" class="hint-text">2px</span>
    </div>
    <label>Digit size</label>
    <div class="row">
      <input type="range" id="digitSize" min="50" max="200" step="5" value="100" style="flex:1; min-width:140px;" />
      <span id="digitSizeLabel" class="hint-text">100%</span>
    </div>
    <button class="ghost-btn" id="resetAppearanceBtn">Reset to defaults</button>
  </section>
</main>

<footer>Tip: click "Float on Top" after starting a timer to keep it visible over any window.</footer>

<audio id="alarmAudio" loop></audio>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const body = document.body;

  // ---------- persistence ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  // ---------- sound ----------
  const alarmAudio = $('alarmAudio');
  let customSoundData = null;
  function loadSound(){
    customSoundData = store.get('timer_sound_data', null);
    const name = store.get('timer_sound_name', null);
    if(customSoundData) alarmAudio.src = customSoundData;
    $('soundName').textContent = name ? ('Custom sound: ' + name) : 'Using a built-in beep (upload your own above).';
  }

  // fallback synthesized bell when no custom sound has been uploaded
  let beepCtx = null;
  let beepTimer = null;
  function startBeep(){
    stopBeep();
    beepCtx = new (window.AudioContext || window.webkitAudioContext)();
    const playOnce = () => {
      if(!beepCtx) return;
      const osc = beepCtx.createOscillator();
      const gain = beepCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, beepCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.5, beepCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, beepCtx.currentTime + 0.5);
      osc.connect(gain).connect(beepCtx.destination);
      osc.start();
      osc.stop(beepCtx.currentTime + 0.5);
    };
    playOnce();
    beepTimer = setInterval(playOnce, 800);
  }
  function stopBeep(){
    if(beepTimer){ clearInterval(beepTimer); beepTimer = null; }
    if(beepCtx){ beepCtx.close().catch(()=>{}); beepCtx = null; }
  }
  $('soundFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      store.set('timer_sound_data', reader.result);
      store.set('timer_sound_name', f.name);
      loadSound();
    };
    reader.readAsDataURL(f);
  });
  $('clearSoundBtn').addEventListener('click', () => {
    localStorage.removeItem('timer_sound_data');
    localStorage.removeItem('timer_sound_name');
    loadSound();
  });
  $('volume').addEventListener('input', (e) => { alarmAudio.volume = parseFloat(e.target.value); });
  alarmAudio.volume = 0.8;
  $('testSoundBtn').addEventListener('click', () => {
    if(customSoundData){
      alarmAudio.currentTime = 0;
      alarmAudio.loop = false;
      alarmAudio.play().catch(()=>{});
    } else {
      startBeep();
      setTimeout(stopBeep, 1600);
    }
  });
  loadSound();

  // ---------- appearance settings (digit colour/outline/size) ----------
  const APPEARANCE_DEFAULTS = { digitColor: '#ffe600', outlineColor: '#ffffff', outlineWidth: 2, sizePercent: 100 };
  const root = document.documentElement;
  function applyAppearance(a){
    root.style.setProperty('--glow-base', a.digitColor);
    root.style.setProperty('--outline-color', a.outlineColor);
    root.style.setProperty('--outline-width', a.outlineWidth + 'px');
    root.style.setProperty('--size-scale', a.sizePercent / 100);
    $('digitColor').value = a.digitColor;
    $('digitColorHex').textContent = a.digitColor.toUpperCase();
    $('outlineColor').value = a.outlineColor;
    $('outlineColorHex').textContent = a.outlineColor.toUpperCase();
    $('outlineWidth').value = a.outlineWidth;
    $('outlineWidthLabel').textContent = a.outlineWidth + 'px';
    $('digitSize').value = a.sizePercent;
    $('digitSizeLabel').textContent = a.sizePercent + '%';
  }
  function saveAppearance(a){ store.set('timer_appearance', a); }
  function loadAppearance(){ return store.get('timer_appearance', APPEARANCE_DEFAULTS); }
  let appearance = loadAppearance();
  applyAppearance(appearance);
  function updateAppearance(patch){
    appearance = Object.assign({}, appearance, patch);
    applyAppearance(appearance);
    saveAppearance(appearance);
  }
  $('digitColor').addEventListener('input', (e) => updateAppearance({ digitColor: e.target.value }));
  $('outlineColor').addEventListener('input', (e) => updateAppearance({ outlineColor: e.target.value }));
  $('outlineWidth').addEventListener('input', (e) => updateAppearance({ outlineWidth: parseInt(e.target.value, 10) }));
  $('digitSize').addEventListener('input', (e) => updateAppearance({ sizePercent: parseInt(e.target.value, 10) }));
  $('resetAppearanceBtn').addEventListener('click', () => updateAppearance(APPEARANCE_DEFAULTS));

  function ringAlarm(){
    if(customSoundData){
      alarmAudio.loop = true;
      alarmAudio.currentTime = 0;
      alarmAudio.play().catch(()=>{});
    } else {
      startBeep();
    }
    body.classList.add('flash');
    $('dismissControls').classList.remove('hidden');
    $('runControls').classList.add('hidden');
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
  }
  function stopAlarm(){
    alarmAudio.pause();
    alarmAudio.loop = false;
    stopBeep();
    body.classList.remove('flash');
    $('dismissControls').classList.add('hidden');
    $('runControls').classList.remove('hidden');
  }
  $('dismissBtn').addEventListener('click', () => {
    stopAlarm();
    onSegmentDismissed();
  });

  // ---------- tabs ----------
  const panels = { timer: $('panel-timer'), schedule: $('panel-schedule'), sound: $('panel-sound'), settings: $('panel-settings') };
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(panels).forEach(p => p.classList.add('hidden'));
      panels[tab.dataset.mode].classList.remove('hidden');
    });
  });

  // ---------- presets ----------
  const PRESET_MINUTES = [1,3,5,10,15,20,25,30,45,60];
  const presetsEl = $('presets');
  PRESET_MINUTES.forEach(m => {
    const b = document.createElement('button');
    b.textContent = m + 'm';
    b.addEventListener('click', () => beginOrAddTime(m*60));
    presetsEl.appendChild(b);
  });
  $('startCustomBtn').addEventListener('click', () => {
    const min = parseInt($('customMin').value || '0', 10);
    const sec = parseInt($('customSec').value || '0', 10);
    const total = min*60 + sec;
    if(total <= 0) return;
    beginOrAddTime(total);
  });

  // ---------- countdown to a time of day ----------
  // e.g. "10:00 AM" auto-calculates how many seconds from now that is,
  // rolling over to tomorrow if that time has already passed today
  function formatClock12(hh, mm){
    const period = hh >= 12 ? 'PM' : 'AM';
    let h12 = hh % 12;
    if(h12 === 0) h12 = 12;
    return h12 + ':' + String(mm).padStart(2, '0') + ' ' + period;
  }
  function secondsUntilTimeOfDay(hh, mm){
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
    let isTomorrow = false;
    if(target <= now){
      target.setDate(target.getDate() + 1);
      isTomorrow = true;
    }
    return { seconds: Math.round((target - now) / 1000), isTomorrow };
  }
  function updateTargetHint(){
    const val = $('targetTime').value;
    const hint = $('targetHint');
    if(!val){ hint.textContent = ''; return; }
    const [hh, mm] = val.split(':').map(Number);
    const { seconds, isTomorrow } = secondsUntilTimeOfDay(hh, mm);
    hint.textContent = 'Goes off in ' + formatDurationLabel(seconds).replace(' countdown', '')
      + ' — at ' + formatClock12(hh, mm) + (isTomorrow ? ' tomorrow' : '');
  }
  $('targetTime').addEventListener('input', updateTargetHint);
  $('startTargetBtn').addEventListener('click', () => {
    const val = $('targetTime').value;
    if(!val) return;
    const [hh, mm] = val.split(':').map(Number);
    const { seconds, isTomorrow } = secondsUntilTimeOfDay(hh, mm);
    if(seconds <= 0) return;
    beginOrAddTime(seconds, 'Until ' + formatClock12(hh, mm) + (isTomorrow ? ' tomorrow' : ''));
  });

  // formats a duration as "1h 18m countdown" / "45m countdown" / "30s countdown"
  function formatDurationLabel(seconds){
    const totalMinutes = Math.max(1, Math.round(seconds / 60));
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    const parts = h > 0 ? [h + 'h', m + 'm'] : [m + 'm'];
    return parts.join(' ') + ' countdown';
  }

  // when a plain (non-schedule) timer is already active or paused, clicking
  // a preset or Start again adds that time instead of restarting the clock;
  // passing no label means "auto" — the label always reflects total duration
  function beginOrAddTime(seconds, label){
    if(queue.length === 0 && remaining > 0){
      addTime(seconds);
    } else {
      startTimer(seconds, label);
    }
  }
  function addTime(seconds){
    totalSeconds += seconds;
    remaining += seconds;
    if(!currentLabel) segmentLabelEl.textContent = formatDurationLabel(totalSeconds);
    render();
  }

  // ---------- core countdown engine ----------
  let totalSeconds = 0;
  let remaining = 0;
  let running = false;
  let intervalId = null;
  let queue = []; // list of {name, seconds} for schedule mode
  let queueIndex = -1;
  let currentLabel = null; // explicit name (schedule/break), null = auto duration label

  const displayEl = $('display');
  const segmentLabelEl = $('segmentLabel');
  const upnextEl = $('upnext');

  function fmt(s){
    s = Math.max(0, Math.round(s));
    if(s >= 3600){
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return h + 'h ' + String(m).padStart(2,'0') + 'm';
    }
    const m = Math.floor(s/60);
    const sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function stageFor(remSec, totalSec){
    const remMin = remSec/60;
    if(remSec <= 0) return 'red';
    if(remMin <= 1) return 'red';
    if(remMin <= 5) return 'orange';
    return 'yellow';
  }

  function applyStage(stage){
    ['stage-yellow','stage-orange','stage-red']
      .forEach(c => body.classList.remove(c));
    body.classList.add('stage-' + stage);
  }

  function render(){
    displayEl.textContent = fmt(remaining);
    if(running) applyStage(stageFor(remaining, totalSeconds));
  }

  function tick(){
    remaining -= 1;
    if(remaining <= 0){
      remaining = 0;
      render();
      clearInterval(intervalId);
      intervalId = null;
      running = false;
      ringAlarm();
      return;
    }
    render();
  }

  function startTimer(seconds, label){
    stopAlarm();
    clearInterval(intervalId);
    totalSeconds = seconds;
    remaining = seconds;
    running = true;
    currentLabel = label || null;
    segmentLabelEl.textContent = currentLabel || formatDurationLabel(totalSeconds);
    render();
    intervalId = setInterval(tick, 1000);
    $('pauseBtn').textContent = '⏸️';
  }

  $('pauseBtn').addEventListener('click', () => {
    if(running){
      clearInterval(intervalId); intervalId = null; running = false;
      $('pauseBtn').textContent = '▶️';
    } else if(remaining > 0){
      running = true;
      intervalId = setInterval(tick, 1000);
      $('pauseBtn').textContent = '⏸️';
    }
  });
  $('resetBtn').addEventListener('click', () => {
    clearInterval(intervalId); intervalId = null; running = false;
    remaining = totalSeconds;
    render();
    $('pauseBtn').textContent = '⏸️';
  });
  $('stopBtn').addEventListener('click', () => {
    clearInterval(intervalId); intervalId = null; running = false;
    stopAlarm();
    totalSeconds = 0; remaining = 0;
    currentLabel = null;
    queue = []; queueIndex = -1;
    segmentLabelEl.textContent = '';
    upnextEl.textContent = '';
    applyStage('yellow');
    displayEl.textContent = '00:00';
  });

  // called after the user dismisses a finished alarm
  function onSegmentDismissed(){
    if(queue.length && queueIndex < queue.length - 1){
      queueIndex += 1;
      const seg = queue[queueIndex];
      const next = queue[queueIndex+1];
      upnextEl.textContent = next ? ('Up next: ' + next.name) : 'Last item';
      startTimer(seg.seconds, seg.name);
      return;
    }
    if(queue.length){
      // schedule finished
      segmentLabelEl.textContent = 'Schedule complete';
      upnextEl.textContent = '';
      queue = []; queueIndex = -1;
      return;
    }
    if(pendingBreak){
      const b = pendingBreak; pendingBreak = null;
      startTimer(b*60, 'Break');
    }
  }

  // ---------- auto break after single timer ----------
  let pendingBreak = null;
  $('startCustomBtn').addEventListener('click', () => {
    if($('autoBreak').checked){
      pendingBreak = parseInt($('breakMin').value || '0', 10) || null;
    } else {
      pendingBreak = null;
    }
  });
  presetsEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      pendingBreak = $('autoBreak').checked ? (parseInt($('breakMin').value || '0', 10) || null) : null;
    });
  });

  // ---------- schedule builder ----------
  const scheduleListEl = $('scheduleList');
  function addScheduleRow(name, minutes){
    const row = document.createElement('div');
    row.className = 'schedule-item';
    row.innerHTML = `
      <input type="text" placeholder="Event name" value="${name || ''}" />
      <input type="number" min="1" placeholder="min" value="${minutes || ''}" />
      <button class="icon-btn" title="Remove">✕</button>
    `;
    row.querySelector('.icon-btn').addEventListener('click', () => row.remove());
    scheduleListEl.appendChild(row);
  }
  $('addEventBtn').addEventListener('click', () => addScheduleRow('', ''));
  addScheduleRow('Opening', 10);
  addScheduleRow('Main session', 30);
  addScheduleRow('Q&A', 10);

  $('startScheduleBtn').addEventListener('click', () => {
    const rows = [...scheduleListEl.querySelectorAll('.schedule-item')];
    const items = rows.map(r => {
      const [nameInput, minInput] = r.querySelectorAll('input');
      const minutes = parseFloat(minInput.value || '0');
      return { name: nameInput.value || 'Event', seconds: Math.round(minutes*60) };
    }).filter(i => i.seconds > 0);
    if(!items.length) return;
    queue = items;
    queueIndex = 0;
    const first = queue[0];
    const next = queue[1];
    upnextEl.textContent = next ? ('Up next: ' + next.name) : 'Last item';
    startTimer(first.seconds, first.name);
    document.querySelector('.tab[data-mode="timer"]').click();
  });

  // ---------- always on top via Document Picture-in-Picture ----------
  const timerCard = $('timerCard');
  const pipBtn = $('pipBtn');
  let pipWindow = null;
  const originalParent = timerCard.parentNode;
  const originalNextSibling = timerCard.nextSibling;

  function copyStylesInto(doc){
    document.querySelectorAll('style').forEach(styleTag => {
      doc.head.appendChild(styleTag.cloneNode(true));
    });
  }

  pipBtn.addEventListener('click', async () => {
    if(!('documentPictureInPicture' in window)){
      $('pipNote').classList.remove('hidden');
      alert('Floating always-on-top windows need Chrome or Edge on desktop. This browser does not support it — the timer will keep running in this tab.');
      return;
    }
    try{
      pipWindow = await documentPictureInPicture.requestWindow({ width: 340, height: 260 });
      copyStylesInto(pipWindow.document);
      pipWindow.document.body.style.margin = '0';
      pipWindow.document.body.appendChild(timerCard);
      timerCard.classList.add('is-floating');
      pipWindow.addEventListener('pagehide', () => {
        timerCard.classList.remove('is-floating', 'controls-visible');
        originalParent.insertBefore(timerCard, originalNextSibling);
        pipWindow = null;
      });
    }catch(err){
      alert('Could not open the floating window: ' + err.message);
    }
  });

  // ---------- auto-hide controls while floating ----------
  // buttons tuck below the edge and only reappear when the cursor nears
  // the bottom of the floating window, or while it's already over them
  const hoverZone = $('hoverZone');
  let hideControlsTimer = null;
  function showControls(){
    clearTimeout(hideControlsTimer);
    timerCard.classList.add('controls-visible');
  }
  function scheduleHideControls(){
    clearTimeout(hideControlsTimer);
    hideControlsTimer = setTimeout(() => {
      timerCard.classList.remove('controls-visible');
    }, 600);
  }
  [hoverZone, $('displayFrame'), $('runControls'), $('dismissControls')].forEach(el => {
    el.addEventListener('mouseenter', showControls);
    el.addEventListener('mouseleave', scheduleHideControls);
  });

  // ---------- Electron shell detection ----------
  // when running as the desktop app, the whole window is already
  // always-on-top and frameless, so the PiP button and note are unneeded
  // and a close button + drag region take their place
  if(navigator.userAgent.includes('Electron')){
    pipBtn.classList.add('hidden');
    $('closeAppBtn').classList.remove('hidden');
    $('closeAppBtn').addEventListener('click', () => window.close());
    timerCard.classList.add('is-floating');
  }

  applyStage('yellow');
})();
</script>
</body>
</html>
